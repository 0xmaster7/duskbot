<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="/site.css"><link rel="stylesheet" href="/home.css"><link rel="stylesheet" href="/readme/readme.css"></head>
<body><main class="home"><div id="shot" class="tight"></div></main>
<script type="module">
import { take, done } from "/readme/landing.js";
const hero = await take(".hero");
hero.querySelector(".actions")?.remove();
hero.querySelector(".hint")?.remove();
// the phone app is not out yet, so the tag names the desktop builds only
const tag = hero.querySelector(".tag.avail");
const parts = [...tag.children];
const ios = parts.findIndex((el) => /\bios\b/.test(el.textContent));
if (ios > 0) parts.slice(ios - 1).forEach((el) => el.remove());
hero.style.paddingTop = "40px";
document.querySelector("#shot").append(hero);
await done();
</script></body></html>
