<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="/site.css"><link rel="stylesheet" href="/home.css"><link rel="stylesheet" href="/readme/readme.css"></head>
<style>#shot { width: auto; display: inline-block; padding: 4px; } .btn { white-space: nowrap; }</style>
<body><main class="home"><div id="shot"></div></main>
<script type="module">
import { take, done } from "/readme/landing.js";
const os = new URLSearchParams(location.search).get("os");
const shot = document.querySelector("#shot");
if (os === "site") {
  const quiet = await take(".hero .cloud-cta");
  quiet.textContent = "dusk.bot";
  shot.append(quiet);
} else {
  const button = await take(".hero .split-main");
  const menu = await take(".hero .dl-menu");
  const icon = menu.querySelector(`[data-os="${os}"] svg`);
  button.querySelector(".dl-os").replaceChildren(icon);
  button.querySelector(".dl-label").textContent = `download for ${os === "mac" ? "mac" : os}`;
  const wrap = Object.assign(document.createElement("div"), { className: "split" });
  wrap.append(button);
  button.style.borderRadius = "999px";
  shot.append(wrap);
}
await done();
</script></body></html>
