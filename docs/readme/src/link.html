<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="/site.css"><link rel="stylesheet" href="/home.css"><link rel="stylesheet" href="/readme/readme.css">
<style>
.cols { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1fr) minmax(0, 1.25fr); }
.r-card { display: flex; flex-direction: column; }
.r-card .fig { margin-top: auto; }
.rows li { grid-template-columns: 30px 1fr; }
.r-ways { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.r-ways li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; padding: 8px 12px; border-radius: var(--r-m); background: var(--wash); line-height: 1.3; }
.r-ways li > b:first-child { font: 600 18px/1.1 var(--pixel); }
.r-ways span { display: block; font: 500 12px/1.35 var(--mono); color: var(--ink-2); margin-top: 2px; }
.lock { margin-top: 10px; font: 500 12px/1.45 var(--mono); color: var(--ink-2); }
.lock b { color: var(--ink); font-weight: 500; }
.r-box { display: grid; gap: 10px; }
.r-box h4 { margin: 0 0 6px; font-size: 14px; font-weight: 550; }
.r-box h4 span { font: 500 12px/1 var(--mono); color: var(--ink-3); margin-left: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; border-radius: 7px; background: var(--wash); font-size: 13px; font-weight: 550; }
.chips img { width: 14px; height: 14px; }
html.dark .chips img { background: #fff; border-radius: 4px; padding: 1px; }
</style></head>
<body><main class="home"><div id="shot" class="pad">
  <div class="head split" style="margin-bottom:0">
    <h2>how it fits together.</h2>
    <p>the app is where you talk. the bot computer is where the work happens: this computer, dusk cloud or your own server.</p>
  </div>
  <div class="r-grid cols">
    <article class="r-card">
      <h3>you</h3>
      <p>one workspace, on any screen.</p>
      <figure class="fig"><ul class="rows">
        <li data-b="kit:violet"><div><b>desktop app</b><span>mac, windows, linux</span></div></li>
        <li data-b="pip:blue"><div><b>phone app</b><span>coming soon</span></div></li>
        <li data-b="starry:emerald"><div><b>a browser</b><span>signs in once</span></div></li>
      </ul></figure>
    </article>
    <article class="r-card">
      <h3>the link</h3>
      <p>the most direct way that answers.</p>
      <figure class="fig">
        <ol class="r-ways">
          <li><b>1</b><div><b>direct</b><span>same computer, ssh, https, tailscale</span></div></li>
          <li><b>2</b><div><b>cloudflare tunnel</b><span>on your server, no open ports</span></div></li>
          <li><b>3</b><div><b>dusk bot relay</b><span>only when nothing else answers</span></div></li>
        </ol>
        <p class="lock"><b>end to end:</b> aes-256-gcm with a key only your app and your server hold. the relay passes sealed blobs.</p>
      </figure>
    </article>
    <article class="r-card">
      <h3>the bot computer</h3>
      <p>runs the bots, their tools and your data.</p>
      <figure class="fig r-box">
        <div><h4>dusk bot server<span>127.0.0.1:8799</span></h4><div class="chips"><span>chats</span><span>routines</span><span>approvals</span><span>vault</span><span>memory</span></div></div>
        <div><h4>engines</h4><div class="chips">
          <span><img src="/art/logos/claude.svg" alt="">claude code</span><span><img src="/art/logos/chatgpt.svg" alt="">codex</span><span><img src="/art/logos/gemini.svg" alt="">gemini</span><span><img src="/art/logos/grok.svg" alt="">grok</span><span>+ more</span></div></div>
        <div><h4>tools</h4><div class="chips"><span>browser</span><span>desktop</span><span>files</span><span>shell</span><span>apps</span></div></div>
        <div><h4>your data<span>~/.duskbot</span></h4></div>
      </figure>
    </article>
  </div>
</div></main>
<script type="module">
import { bot, done } from "/readme/landing.js";
for (const el of document.querySelectorAll("[data-b]")) {
  const [shape, color] = el.dataset.b.split(":");
  el.prepend(await bot(shape, color));
}
await done();
</script></body></html>
