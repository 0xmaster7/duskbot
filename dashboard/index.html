<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d1d1d" />
    <meta name="referrer" content="no-referrer" />
    <title>OpenMausBot account</title>
    <link rel="preload" href="./src/fonts/geist-serif.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      try { var t = localStorage.getItem("omb-dash-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; else if (t === "system" && matchMedia("(prefers-color-scheme: light)").matches) document.documentElement.dataset.theme = "light"; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
