<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>dusk page builder</title>
<link rel="icon" href="/art/cursor-88.webp" type="image/webp">
<link rel="preload" href="fonts/general-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <b class="title">page builder</b>
  <span class="count" id="count"></span>
  <div class="tools">
    <div class="seg" id="zoom" role="group" aria-label="page size">
      <button type="button" data-z="s">small</button><button type="button" data-z="m">medium</button><button type="button" data-z="l">full</button>
    </div>
    <button type="button" class="btn" id="copy">copy list</button>
    <button type="button" class="btn" id="save">save image</button>
    <button type="button" class="btn quiet" id="clear">clear</button>
  </div>
</header>
<div class="cols">
  <aside class="lib" aria-label="pieces">
    <div class="chips" id="sites"></div>
    <div class="chips" id="kinds"></div>
    <ul class="grid" id="grid"></ul>
  </aside>
  <main class="canvas" id="canvas">
    <div class="sheet" id="sheet">
      <ol class="page" id="page"></ol>
      <i class="mark" id="mark" hidden></i>
      <p class="empty" id="empty">drag pieces here to build the page.<span>or click a piece to add it to the end.</span></p>
    </div>
  </main>
</div>
<p class="toast" id="toast" role="status" hidden></p>
<script src="pieces.js"></script>
<script src="script.js"></script>
</body>
</html>
