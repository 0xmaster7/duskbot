<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>dusk email art</title>
<style>
  @font-face { font-family: 'General Sans'; src: url(../../public/landing/fonts/general-sans.woff2) format('woff2'); font-weight: 200 700; }
  @font-face { font-family: 'Pixelify Sans'; src: url(../../public/landing/fonts/pixelify-sans.woff2) format('woff2'); font-weight: 400 700; }
  @font-face { font-family: 'Geist Mono'; src: url(../../public/landing/fonts/geist-mono.woff2) format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; background: #fff; }
  canvas { display: block; image-rendering: pixelated; }
</style></head>
<body>
<script>
// the email art: the x banner's pixel world, one scene per email, drawn at the 2x size on a 10px block grid.
// served from ~/Desktop/code (sprites come from omb-ref); render.mjs screenshots each ?scene=
const SPRITES = '/omb-ref/brand/x-banners/lib/sprites/';
const P = { sky0: '#06bafd', sky1: '#3cd0fd', sky4: '#90e4fc', sky5: '#c2ecfc', lilac: '#d0cefb', lime: '#c9f63f', lime2: '#bde834', white: '#fdfdfd',
  pink: '#ffc4dd', lemon: '#fff3a0', lemonDeep: '#ffe25c', ink: '#212121', sky: '#c2ecfc' };
const PAL = {
  day: { bands: [['#06bafd', 0], ['#3cd0fd', .2], ['#90e4fc', .8], ['#c2ecfc', .9]], strip: P.lilac, ground: P.lime, fleck: P.lime2 },
  night: { bands: [['#0a1238', 0], ['#111d4f', .25], ['#1b2c6b', .62], ['#2a3f86', .86]], strip: '#5b54b8', ground: '#86b02a', fleck: '#78a022' },
  dusk: { bands: [['#3a2a7a', 0], ['#6c3fa3', .24], ['#d9649b', .55], ['#ff9a8b', .76], ['#ffc98f', .9]], strip: '#f7b6c8', ground: '#bcd93c', fleck: '#aecb33' },
  late: { bands: [['#1d1650', 0], ['#3a2a7a', .3], ['#8a4aa6', .62], ['#e0739a', .84]], strip: '#b58ad0', ground: '#9cc232', fleck: '#8fb52b' },
  rain: { bands: [['#7f97b5', 0], ['#93a9c3', .3], ['#aebfd2', .7], ['#c8d5e2', .88]], strip: '#c9c6e6', ground: '#b6d548', fleck: '#a8c83f' },
  warm: { bands: [['#06bafd', 0], ['#3cd0fd', .22], ['#90e4fc', .7], ['#fff3a0', .9]], strip: '#ffe25c', ground: P.lime, fleck: P.lime2 },
};
let seed = 7;
const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const load = (src) => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('load ' + src)); i.src = src; });
const bot = (name) => load(SPRITES + 'bot-' + name + '.png');

let ctx, W, H, B = 10;
function canvas(w, h, b = 10) {
  const cv = document.createElement('canvas'); cv.width = W = w; cv.height = H = h; B = b;
  document.body.append(cv); ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
}
const snap = (v) => Math.round(v / B) * B;
function sky(pal, horizon, s0 = 11) {
  seed = s0;
  const bands = pal.bands.map(([c, t]) => [c, snap(t * horizon)]);
  bands.forEach(([c, y], i) => { const y1 = i + 1 < bands.length ? bands[i + 1][1] : H; ctx.fillStyle = c; ctx.fillRect(0, y, W, y1 - y); });
  for (let i = 1; i < bands.length; i++) {
    const [c, y] = bands[i], [cp] = bands[i - 1];
    for (let k = 1; k <= 3; k++) {
      const p = [0.42, 0.16, 0.05][k - 1];
      for (let x = 0; x < W; x += B) {
        if (rnd() < p) { ctx.fillStyle = c; ctx.fillRect(x, y - k * B, B, B); }
        if (k == 1 && rnd() < 0.1) { ctx.fillStyle = cp; ctx.fillRect(x, y, B, B); }
      }
    }
  }
}
function ground(pal, G, hills = [], s0 = 5) {
  const hx = (x) => { let y = G; for (const [cx, r, h] of hills) { const d = Math.abs(x - cx) / r; if (d < 1) y = Math.min(y, G - h * (1 - d * d) ** 0.7); } return y; };
  ctx.fillStyle = pal.strip;
  for (let x = 0; x < W; x += B) { const y = snap(hx(x + B / 2)); ctx.fillRect(x, y - B, B, B); }
  ctx.fillStyle = pal.ground;
  for (let x = 0; x < W; x += B) { const y = snap(hx(x + B / 2)); ctx.fillRect(x, y, B, H - y); }
  seed = s0; ctx.fillStyle = pal.fleck;
  const half = B / 2;
  for (let i = 0; i < W / 9; i++) ctx.fillRect(Math.round(rnd() * W / half) * half, Math.round((G + B + rnd() * (H - G - B)) / half) * half, half * (rnd() < .5 ? 2 : 1), half);
  return (x) => snap(hx(x));
}
function flowers(G, n, s0 = 3, avoid) {
  seed = s0; const b = B / 2, cols = [P.white, P.pink, P.lemon];
  for (let i = 0; i < n; i++) {
    const x = Math.round(rnd() * (W - 20) / b) * b + 10, y = Math.round((G + 2 * B + rnd() * (H - G - 3 * B)) / b) * b;
    if (avoid && avoid(x, y)) continue;
    ctx.fillStyle = cols[i % 3]; ctx.fillRect(x, y - b, b, b); ctx.fillRect(x - b, y, b, b); ctx.fillRect(x + b, y, b, b); ctx.fillRect(x, y + b, b, b);
    ctx.fillStyle = i % 3 == 2 ? '#ffb020' : P.lemonDeep; ctx.fillRect(x, y, b, b);
  }
}
function stars(top, bottom, n, s0 = 9) {
  seed = s0;
  for (let i = 0; i < n; i++) {
    const x = snap(rnd() * W), y = snap(top + rnd() * (bottom - top)), big = rnd() < .18;
    ctx.fillStyle = rnd() < .3 ? P.lemon : P.white;
    const b = B / 2;
    if (big) { ctx.fillRect(x, y - b, b, b * 3); ctx.fillRect(x - b, y, b * 3, b); } else ctx.fillRect(x, y, b, b);
  }
}
function shape(x0, y0, w, h, test, colour, b = B) {
  ctx.fillStyle = colour;
  for (let y = 0; y < h; y += b) for (let x = 0; x < w; x += b) if (test(x + b / 2, y + b / 2)) ctx.fillRect(x0 + x, y0 + y, b, b);
}
const cloudTest = (w, h) => (px, py) => {
  const u = px / w, v = py / h, lumps = [[0.5, 0.62, 0.5, 0.38], [0.33, 0.5, 0.2, 0.42], [0.62, 0.36, 0.22, 0.5]];
  if (v > 0.95) return false;
  return lumps.some(([cx, cy, rx, ry]) => ((u - cx) / rx) ** 2 + ((v - cy) / ry) ** 2 < 1) || (v > 0.6 && u > 0.04 && u < 0.96);
};
function cloud(x, y, w, h, under = P.pink, body = P.white) {
  x = snap(x); y = snap(y);
  const t = cloudTest(w, h);
  shape(x, y, w, h, t, under);
  shape(x, y - B, w, h, (px, py) => t(px, py + B) && t(px, py + 2 * B), body);
  return { top: (cx) => { for (let yy = 0; yy < h; yy += B) if (t(cx - x + B / 2, yy + B + B / 2)) return y + yy; return y + h; } };
}
function dottedCloud(x, y, w, h, colour) {
  x = snap(x); y = snap(y);
  const t = cloudTest(w, h);
  const edge = (px, py) => t(px, py) && !(t(px - B, py) && t(px + B, py) && t(px, py - B) && t(px, py + B));
  ctx.fillStyle = colour;
  for (let yy = 0; yy < h; yy += B) for (let xx = 0; xx < w; xx += B) if (edge(xx + B / 2, yy + B / 2) && (xx / B + yy / B) % 2 == 0) ctx.fillRect(x + xx, y + yy, B, B);
}
function sprite(img, cx, footY, s, flip = false) {
  const w = img.width * s, h = img.height * s, x = Math.round((cx - w / 2) / s) * s, y = footY - h;
  ctx.save();
  if (flip) { ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0, w, h); } else ctx.drawImage(img, x, y, w, h);
  ctx.restore(); return { x, y, w, h };
}
// the banner's chat bubble: white body, tinted underside, stepped corners, a stepped tail toward the speaker
function bubble(text, x, y, under, tail = 'l', size = 34) {
  ctx.font = `500 ${size}px "General Sans"`;
  const b = B / 2, padX = 26, w = Math.ceil((ctx.measureText(text).width + padX * 2) / b) * b, h = Math.ceil((size + 38) / b) * b;
  x = snap(x); y = snap(y);
  const body = (px, py) => { const cx = Math.min(px, w - px), cy = Math.min(py, h - py); if (cx < 3 * b && cy < 3 * b) return (3 * b - cx) + (3 * b - cy) <= 4 * b; return true; };
  shape(x, y + 2 * b, w, h, body, under, b);
  shape(x, y, w, h, body, P.white, b);
  const tx = tail == 'r' ? x + w - 9 * b : x + 5 * b;
  for (let i = 0; i < 4; i++) {
    const xx = tail == 'r' ? tx + i * b : tx - i * b + 3 * b;
    ctx.fillStyle = under; ctx.fillRect(xx, y + h + i * b + 2 * b, (4 - i) * b, b);
    ctx.fillStyle = P.white; ctx.fillRect(xx, y + h + i * b, (4 - i) * b, b);
  }
  ctx.fillStyle = P.ink; ctx.textBaseline = 'middle'; ctx.fillText(text, x + padX, y + h / 2 + 1);
  return { w, h };
}
function sun(cx, horizon, r, colour = P.lemon) {
  shape(snap(cx - r), snap(horizon - r), 2 * r, r, (px, py) => (px - r) ** 2 + (py - r) ** 2 < r * r, colour);
}
function moon(cx, cy, r) {
  shape(snap(cx - r), snap(cy - r), 2 * r, 2 * r, (px, py) => (px - r) ** 2 + (py - r) ** 2 < r * r && (px - r * 1.45) ** 2 + (py - r * 0.75) ** 2 > (r * 0.85) ** 2, P.lemon);
}

const scenes = {
  async code() {
    canvas(1200, 240); const G = 190, pal = PAL.day;
    sky(pal, G, 13); const top = ground(pal, G, [[930, 170, 40]]); flowers(G, 9, 4, (x) => x > 820 && x < 1040);
    const s = sprite(await bot('kit'), 930, top(930) + 5, 6);
    bubble('psst, your code.', 560, 46, P.lemon, 'r');
  },
  async welcome() {
    canvas(1200, 360); const G = 290, pal = PAL.day;
    sky(pal, G, 11);
    cloud(60, 40, 200, 70, P.pink); cloud(980, 70, 170, 60, P.lemon);
    const top = ground(pal, G, [[600, 220, 40]]);
    flowers(G, 12, 3, (x) => x > 420 && x < 780);
    const crowd = [['pip', 110, 5], ['mochi', 215, 5], ['loaf', 320, 5], ['ribbit', 420, 4], ['hoot', 790, 4], ['cheep', 885, 5], ['goo', 990, 5], ['boo', 1095, 5]];
    for (const [n, x, s] of crowd) sprite(await bot(n), x, top(x) + 5, s, x > 600);
    sprite(await bot('kit'), 600, top(600) + 5, 7);
    const m = bubble('hi! meet your new team.', 380, 92, P.pink, 'r');
  },
  async 'cloud-ready'() {
    canvas(1200, 360); const G = 300, pal = PAL.day;
    sky(pal, G, 17);
    cloud(110, 50, 150, 50, P.lemon);
    const c = cloud(640, 120, 380, 130, P.sky);
    const top = ground(pal, G, []); flowers(G, 14, 6);
    sprite(await bot('pip'), 830, c.top(830) + 15, 7);
    sprite(await bot('puff'), 170, G + 5, 4); sprite(await bot('drip'), 250, G + 5, 4, true);
    bubble('your cloud is up.', 330, 74, P.lemon, 'r');
  },
  async receipt() {
    canvas(1200, 360); const G = 300, pal = PAL.warm;
    sky(pal, G, 19); cloud(90, 60, 170, 60, P.pink); cloud(950, 40, 160, 56, P.white === '#fdfdfd' ? P.lemon : P.lemon);
    ground(pal, G, []); flowers(G, 12, 8, (x) => x > 420 && x < 820);
    // the ticket
    const tw = 300, th = 190, tx = snap(600 - tw / 2), ty = snap(G - th + 20), b = B / 2;
    const step = (px, py) => { const cx = Math.min(px, tw - px), cy = Math.min(py, th - py); if (cx < 3 * b && cy < 3 * b) return (3 * b - cx) + (3 * b - cy) <= 4 * b; const nx = Math.abs(py - th * .62); return !(nx < 2 * b && (px < 3 * b || px > tw - 3 * b)); };
    shape(tx, ty + 2 * b, tw, th, step, P.lemonDeep, b); shape(tx, ty, tw, th, step, P.white, b);
    ctx.fillStyle = '#d6d6dc'; for (let x = tx + 30; x < tx + tw - 30; x += 20) ctx.fillRect(x, ty + snap(th * .62), 10, 4);
    ctx.fillStyle = P.ink; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'center';
    ctx.font = '500 22px "Geist Mono"'; ctx.fillStyle = '#7a7a84'; ctx.fillText('dusk bot', tx + tw / 2, ty + 44);
    ctx.font = '600 72px "Pixelify Sans"'; ctx.fillStyle = P.ink; ctx.fillText('paid', tx + tw / 2, ty + 106);
    ctx.font = '500 20px "Geist Mono"'; ctx.fillStyle = '#7a7a84'; ctx.fillText('thank you', tx + tw / 2, ty + 160);
    ctx.textAlign = 'left';
    sprite(await bot('loaf'), 860, G + 5, 6, true);
    sprite(await bot('cheep'), 340, G + 5, 5);
  },
  async payment() {
    canvas(1200, 360); const G = 300, pal = PAL.rain;
    sky(pal, G, 23);
    const top = ground(pal, G, [[780, 200, 30]]); flowers(G, 8, 9, (x) => x > 620 && x < 940);
    cloud(660, 70, 240, 80, '#8796ad', '#e6ebf2');
    seed = 4; ctx.fillStyle = '#4f7bd8';
    for (let i = 0; i < 16; i++) { const x = snap(690 + rnd() * 180), y = snap(170 + rnd() * 70); ctx.fillRect(x, y, 5, 15); }
    sprite(await bot('pip'), 780, top(780) + 5, 6);
    bubble('card trouble.', 250, 110, P.pink, 'r');
  },
  async cancelled() {
    canvas(1200, 360); const G = 300, pal = PAL.dusk;
    sky(pal, G, 29); sun(250, G - 10, 90, '#ffe9a8');
    const top = ground(pal, G, [[880, 220, 40]]); flowers(G, 10, 12, (x) => x > 720 && x < 1040);
    sprite(await bot('mochi'), 880, top(880) + 5, 7);
    sprite(await bot('egg'), 1060, G + 5, 4, true);
    bubble('see you soon.', 520, 92, P.lemon, 'r');
  },
  async 'cloud-deleted'() {
    canvas(1200, 360); const G = 300, pal = PAL.night;
    sky(pal, G, 31); stars(10, 220, 46, 5); moon(140, 80, 40);
    dottedCloud(560, 70, 360, 130, '#8e86e6');
    const top = ground(pal, G, [[420, 200, 30]]);
    sprite(await bot('wisp'), 420, top(420) + 5, 6);
    bubble('all cleared.', 160, 150, P.lilac, 'r');
  },
  async 'account-deleted'() {
    canvas(1200, 360); const G = 300, pal = PAL.late;
    sky(pal, G, 37); stars(10, 120, 22, 8); sun(700, G - 10, 70, '#ffc98f');
    const top = ground(pal, G, [[700, 300, 30]]);
    sprite(await bot('kit'), 960, top(960) + 5, 6, true);
    bubble('bye for now.', 300, 96, P.pink, 'r');
  },
  async device() {
    canvas(1200, 360); const G = 300, pal = PAL.day;
    sky(pal, G, 41); cloud(120, 60, 170, 60, P.lemon);
    const top = ground(pal, G, [[860, 200, 40]]); flowers(G, 10, 14, (x) => x > 700 && x < 1020);
    sprite(await bot('hoot'), 860, top(860) + 5, 7);
    bubble('was this you?', 470, 86, P.lilac, 'r');
  },
  async 'heads-up'() {
    canvas(1200, 360); const G = 300, pal = PAL.dusk;
    sky(pal, G, 43);
    const top = ground(pal, G, [[820, 200, 40]]); flowers(G, 9, 16, (x) => x > 660 && x < 980);
    const foot = top(820) + 5, s = sprite(await bot('cheep'), 820, foot, 7);
    ctx.fillStyle = '#7a5a2a'; ctx.fillRect(s.x + s.w + 10, foot - 170, 10, 170);
    ctx.fillStyle = P.lemonDeep; ctx.fillRect(s.x + s.w + 20, foot - 170, 70, 50); ctx.fillStyle = P.lemon; ctx.fillRect(s.x + s.w + 20, foot - 170, 70, 40);
    bubble('heads up.', 420, 96, P.lemon, 'r');
  },
  async promo() {
    canvas(1200, 360); const G = 300, pal = PAL.day;
    sky(pal, G, 47);
    const a = cloud(120, 110, 300, 100, P.pink), c = cloud(780, 80, 320, 110, P.lemon);
    cloud(470, 40, 160, 56, P.sky);
    const top = ground(pal, G, []); flowers(G, 16, 18);
    sprite(await bot('kit'), 230, a.top(230) + 15, 5); sprite(await bot('mochi'), 320, a.top(320) + 15, 5, true);
    sprite(await bot('pip'), 900, c.top(900) + 15, 5); sprite(await bot('loaf'), 990, c.top(990) + 15, 5, true);
    for (const [n, x] of [['ribbit', 520], ['goo', 640], ['boxo', 1120], ['starry', 70]]) sprite(await bot(n), x, G + 5, 4, x > 600);
  },
  async 'cloud-night'() {
    canvas(1040, 320); const G = 270, pal = PAL.night;
    sky(pal, G, 53); stars(10, 200, 40, 3); moon(900, 70, 36);
    const top = ground(pal, G, []);
    const c = cloud(300, 100, 440, 140, '#3a4fa0', '#e8ecff');
    sprite(await bot('pip'), 430, c.top(430) + 15, 5); sprite(await bot('mochi'), 520, c.top(520) + 15, 5); sprite(await bot('loaf'), 610, c.top(610) + 15, 5, true);
    bubble('still on it.', 70, 70, P.lemon, 'r', 30);
  },
  async 'tip-jobs'() {
    canvas(144, 144, 8); const G = 112, pal = PAL.day;
    sky(pal, G, 59); ground(pal, G, []);
    const a = sprite(await bot('pip'), 44, G + 4, 4), b2 = sprite(await bot('loaf'), 102, G + 4, 4, true);
    ctx.fillStyle = P.lemon; ctx.fillRect(a.x + 12, a.y - 24, 32, 16); ctx.fillStyle = P.pink; ctx.fillRect(b2.x + 12, b2.y - 24, 32, 16);
  },
  async 'tip-routines'() {
    canvas(144, 144, 8); const G = 112, pal = PAL.warm;
    sky(pal, G, 61); ground(pal, G, []);
    shape(16, 16, 56, 56, (px, py) => (px - 28) ** 2 + (py - 28) ** 2 < 28 * 28, P.white, 4);
    ctx.fillStyle = P.ink; ctx.fillRect(42, 24, 4, 20); ctx.fillRect(42, 40, 16, 4);
    sprite(await bot('ribbit'), 100, G + 4, 4);
  },
  async 'tip-rooms'() {
    canvas(144, 144, 8); const G = 112, pal = PAL.day;
    sky(pal, G, 67); ground(pal, G, []);
    sprite(await bot('mochi'), 30, G + 4, 3); sprite(await bot('kit'), 72, G + 4, 3); sprite(await bot('goo'), 114, G + 4, 3, true);
    const b = 4; shape(40, 12, 64, 36, (px, py) => !((px < b || px > 64 - b) && (py < b || py > 36 - b)), P.white, b);
    ctx.fillStyle = '#7a7a84'; for (const x of [56, 68, 80]) ctx.fillRect(x, 28, 6, 6);
    ctx.fillStyle = P.white; ctx.fillRect(56, 48, 8, 4); ctx.fillRect(56, 52, 4, 4);
  },
};
(async () => {
  await document.fonts.load('500 34px "General Sans"'); await document.fonts.load('600 72px "Pixelify Sans"'); await document.fonts.load('500 22px "Geist Mono"');
  const name = new URLSearchParams(location.search).get('scene');
  await scenes[name]();
  window.READY = true;
})();
</script></body></html>
