<section class="wl" data-wl>
  <canvas class="wl-sky" aria-hidden="true"></canvas>
  <div class="wl-walk" aria-hidden="true">
    <span class="wl-w" data-walk>{{bot pip blue}}</span>
    <span class="wl-w" data-walk>{{bot mochi pink}}</span>
    <span class="wl-w" data-walk>{{bot loaf tangerine}}</span>
    <span class="wl-w" data-walk>{{bot hop sky}}</span>
  </div>
  <div class="wl-col" data-wl-col>
    <span class="wl-kit" aria-hidden="true">{{bot kit white}}</span>
    <h1 data-wl-title tabindex="-1">get dusk bot first.</h1>
    <p class="wl-lede" data-wl-lede>turn the ai you already pay for into bots you text like teammates.</p>
    <form class="wl-form" data-wl-form novalidate>
      <label class="vh" for="wl-email">your email</label>
      <div class="wl-row">
        <input id="wl-email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" maxlength="254" required placeholder="your email" aria-describedby="wl-msg">
        <button class="btn dark" type="submit" data-wl-go>join the waitlist</button>
      </div>
      <div class="wl-hp" aria-hidden="true"><label for="wl-website">leave this empty</label><input id="wl-website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
      <p class="wl-msg" id="wl-msg" role="alert" hidden>{{i triangle-alert}}<span data-wl-err></span></p>
      <p class="wl-count" data-wl-count hidden></p>
      <noscript><p class="wl-count">joining needs javascript. or write to <a href="mailto:hello@dusk.bot?subject=dusk%20bot%20waitlist">hello@dusk.bot</a>.</p></noscript>
    </form>
    <div class="wl-done" data-wl-done hidden>
      <p class="wl-ticket"><span>your spot in line</span><b data-wl-num>#1</b></p>
      <a class="wl-link" href="/">see what dusk bot does</a>
    </div>
  </div>
  <div class="wl-ground" data-wl-ground></div>
</section>
